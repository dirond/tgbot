- name: Almost Done
  hosts: host03
  become: yes
  
  tasks:

  - name: Start postgresql
    systemd:
      name: postgresql
      state: started
      enabled: yes


- name: Prepare Bot
  hosts: host01
  become: yes

  tasks:

  - name: Install git
    apt:
      name:
        - git
      state: latest


- name: Prepare depends
  hosts: host01
  become: yes
  
  tasks:
    
    - name: Clone programm
      shell: "git clone https://github.com/dirond/tgbot/ && cd tgbot && git checkout docker && cd bot"

    - name: Run pip3 install
      shell: "pip3 install -r /home/ansible/tgbot/bot/requirements.txt"
